[project]
name = "briefml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair<5",
    "catboost>=1.2.8",
    "fastapi>=0.128.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.10.0",
    "numpy>=2.4.1",
    "optuna>=4.7.0",
    "pandas>=1.4.0",
    "plotly>=6.5.2",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "speckit-ai>=0.2.4",
    "streamlit>=1.28.0",
    "uvicorn>=0.40.0",
    "xgboost>=3.1.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyright>=1.1.408",
    "python-semantic-release>=9.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
include = ["briefml"]
exclude = ["tests", ".venv"]
typeCheckingMode = "basic"
# models.py uses 'int' as a Pydantic field name (ML feature name), which shadows
# the Python builtin. These rules are disabled to accommodate this API constraint.
reportInvalidTypeForm = "none"
reportGeneralTypeIssues = "none"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.semantic_release]
# Où se trouve le numéro de version à bumper
version_toml = ["pyproject.toml:project.version"]
# Branche de production (releases officielles)
branch = "main"
# Générer le CHANGELOG.md automatiquement
changelog_file = "CHANGELOG.md"
# Ne pas uploader de dist/ sur PyPI (pas un package public)
upload_to_pypi = false
upload_to_release = true

[tool.semantic_release.branches.main]
# Sur main : releases officielles (v1.0.0, v1.1.0...)
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
# Sur develop : pre-releases (v1.0.0-rc.1) — informatif uniquement
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.changelog]
# Sections affichées dans le CHANGELOG
exclude_commit_patterns = ["^chore", "^ci", "^docs", "^style"]

[tool.semantic_release.commit_parser_options]
# Commits qui déclenchent un bump de version
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers"
