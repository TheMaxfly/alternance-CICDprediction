services:

  # ── PostgreSQL (backend MLflow + futur stockage donnees) ──────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-briefml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-briefml} -d ${POSTGRES_DB:-mlflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MLflow Tracking Server ───────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-briefml}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── API FastAPI (prediction CatBoost) ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      MODEL_PATH: /app/model/${MODEL_NAME:-catboost_product15_v2_time_bucket_final}.cbm
      META_PATH: /app/artifacts/${MODEL_NAME:-catboost_product15_v2_time_bucket_final}_meta.json
      MISSING_CAT: ${MISSING_CAT:-__MISSING__}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Streamlit (interface utilisateur) ────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: streamlit
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  # ── Prometheus (collecte des métriques) ─────────────────────────────
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  # ── Alertmanager (routage des alertes) ─────────────────────────────
  alertmanager:
    image: prom/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/discord_webhook_url:/etc/alertmanager/secrets/discord_webhook_url:ro

  # ── Grafana (dashboards) ────────────────────────────────────────────
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ── Node Exporter (métriques hôte) ─────────────────────────────────
  node-exporter:
    image: quay.io/prometheus/node-exporter
    ports:
      - "9100:9100"
    pid: "host"
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  # ── cAdvisor (métriques conteneurs) ────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

volumes:
  pgdata:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
