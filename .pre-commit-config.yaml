exclude: ^(out/|\.specify/|model/)

repos:
  # ── Hooks de base ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace        # Supprime les espaces en fin de ligne
        exclude: '\.cbm$'
      - id: end-of-file-fixer          # Assure une ligne vide en fin de fichier
        exclude: '\.cbm$'
      - id: check-yaml                 # Valide la syntaxe YAML
      - id: check-added-large-files    # Bloque les fichiers > 500KB
      - id: detect-private-key         # Détecte les clés privées commitées
      - id: check-merge-conflict       # Détecte les marqueurs de conflit git

  # ── Ruff — lint + auto-fix ────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]                  # Auto-corrige les erreurs fixables
      - id: ruff-format                # Applique le formatage Ruff (compatible Black)
